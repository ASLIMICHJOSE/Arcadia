<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#211C16"/>
      <stop offset="100%" stop-color="#100F0D"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFCA9B"/>
      <stop offset="50%" stop-color="#C5A46D"/>
      <stop offset="100%" stop-color="#80613C"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background with rounded container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#C5A46D" stroke-width="3" stroke-opacity="0.3"/>
  
  <!-- Outer subtle circular border -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#C5A46D" stroke-width="1.5" stroke-dasharray="8 6" stroke-opacity="0.25"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#C5A46D" stroke-width="1" stroke-opacity="0.2"/>
  
  <!-- 8-Point Compass Star Emblem -->
  <g filter="url(#goldGlow)">
    <path d="M 256 64 L 298 214 L 448 256 L 298 298 L 256 448 L 214 298 L 64 256 L 214 214 Z" 
          fill="url(#goldGrad)" 
          stroke="#FFFFFF" 
          stroke-width="1.5" 
          stroke-opacity="0.4"/>
  </g>
  
  <!-- Inner Diamond & Core Ring -->
  <path d="M 256 186 L 326 256 L 256 326 L 186 256 Z" fill="#100F0D" stroke="#C5A46D" stroke-width="2"/>
  <circle cx="256" cy="256" r="32" fill="#100F0D" stroke="#DFCA9B" stroke-width="3"/>
  <circle cx="256" cy="256" r="14" fill="url(#goldGrad)"/>
</svg>
