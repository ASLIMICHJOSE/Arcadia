worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 2048;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  # Compression for HTML, JS, CSS, JSON, SVG
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # Preserve upstream TLS / WebSocket / Request-Id semantics behind external CDNs/ALBs
  map $http_x_forwarded_proto $arcadia_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  map $http_x_request_id $arcadia_request_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  map $http_upgrade $arcadia_connection_upgrade {
    default upgrade;
    ""      "";
  }

  # Edge rate-limiting zones
  limit_req_status 429;
  limit_req_zone $binary_remote_addr zone=arcadia_auth_burst:10m rate=12r/m;
  limit_req_zone $binary_remote_addr zone=arcadia_api_general:20m rate=120r/m;

  # Load-balanced frontend replicas
  upstream arcadia_web {
    least_conn;
    server web-1:3000 max_fails=3 fail_timeout=10s;
    server web-2:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  # Load-balanced NestJS auth/API replicas
  upstream arcadia_api {
    least_conn;
    server api-1:4000 max_fails=3 fail_timeout=10s;
    server api-2:4000 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # Load balancer edge self-health endpoint
    location = /nginx-health {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok","proxy":"arcadia-nginx"}';
    }

    # Strict edge burst cap on authentication & recovery endpoints
    location ~ ^/api/auth/(login|register|forgot-password|reset-password|resend-verification)$ {
      limit_req zone=arcadia_auth_burst burst=8 nodelay;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $arcadia_forwarded_proto;
      proxy_set_header X-Request-Id $arcadia_request_id;
      proxy_set_header Connection "";

      proxy_pass http://arcadia_api;
    }

    # Direct /api/* routing to NestJS pool (eliminates Next.js rewrite hop in production)
    location /api/ {
      limit_req zone=arcadia_api_general burst=40 nodelay;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $arcadia_forwarded_proto;
      proxy_set_header X-Request-Id $arcadia_request_id;
      proxy_set_header Connection "";

      proxy_pass http://arcadia_api;
    }

    # Immutable content-hashed Next.js static bundles
    location /_next/static/ {
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_hide_header Cache-Control;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      proxy_pass http://arcadia_web;
    }

    # Never serve stale service worker or PWA manifest
    location = /sw.js {
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_hide_header Cache-Control;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Service-Worker-Allowed "/" always;
      proxy_pass http://arcadia_web;
    }

    location = /manifest.json {
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_hide_header Cache-Control;
      add_header Cache-Control "no-cache, must-revalidate" always;
      proxy_pass http://arcadia_web;
    }

    # Next.js PWA SSR / Static pages
    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $arcadia_forwarded_proto;
      proxy_set_header X-Request-Id $arcadia_request_id;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $arcadia_connection_upgrade;

      proxy_pass http://arcadia_web;
    }
  }
}

